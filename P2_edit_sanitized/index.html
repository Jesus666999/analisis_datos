<!doctype html>
<html lang="en">

<head>
    <title>Editar CSV</title>
    <!-- Required meta tags -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid">

        <main class="container-fluid">
            <table class="table table-light">

                <thead class="sticky-header">
                    <tr>
                        <th colspan="100%">
                            <h1>Sanitizar CSV's</h1>
                        </th>
                    </tr>
                    <th class="align-top" colspan="80%">
                        <input type="file" class="form-control" name="fileInput" id="fileInput" accept=".csv"
                            aria-describedby="fileHelpId" />
                    </th>
                    <th class="align-top">
                        <input type="button" value="Guardar" onclick="saveFile()" class="btn btn-outline-primary">
                    </th>
                    <tr id="table_header">
                    </tr>
                </thead>


                <tbody id="file_content">
                </tbody>
            </table>
            <p id="output" style="white-space:pre"></p>
        </main>

        <!-- Bootstrap JavaScript Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"></script>
    </div>
    
    <script src="read_csv.js" defer></script>
</body>

</html>
